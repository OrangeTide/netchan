name: Documentation

# Builds the documentation site on every push and pull request so a broken
# page, a dead link, or a stale API symbol fails CI. Only a push to main
# deploys; a pull request builds and uploads nothing, so a fork cannot
# publish.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. Do not cancel a run in flight: a half-finished deploy
# would leave the live site inconsistent, so let it complete and queue the next.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build the site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # fetch-depth: 0 is load-bearing, not caution. The default shallow
      # checkout carries no tags, so `git describe` finds nothing and every
      # build would stamp the pages as a -dev commit even at a release tag.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install the renderers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            mscgen graphviz lowdown

      - name: Build
        run: make -C docs site OUT="$GITHUB_WORKSPACE/_site"

      # Dead links, root-absolute paths, a missing .nojekyll, and any prose
      # that names a netchan function the header no longer declares.
      - name: Check
        run: make -C docs check OUT="$GITHUB_WORKSPACE/_site"

      - name: Upload the page
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: deploy to Pages
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
